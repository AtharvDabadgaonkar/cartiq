[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cartiq-api"
version = "0.1.0"
description = "CartIQ analytics, ML and experiment statistics service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pandas>=2.2,<3",
  # The committed snapshot the hosted console reads is parquet, so this is a
  # direct dependency, not something to inherit from streamlit by luck.
  "pyarrow>=17,<22",
  "numpy>=1.26,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<0.15",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "httpx>=0.28,<0.29",
  "ruff>=0.8,<0.9",
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2,<3",
  "streamlit>=1.41,<2",
  "altair>=5.4,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

# Ships the py.typed marker so the Streamlit console type-checks against this
# package rather than treating it as untyped.
[tool.setuptools.package-data]
cartiq_api = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../console"]
addopts = [
  "--cov=cartiq_api",
  "--cov-report=term-missing",
  # Stats engine and models are the numbers everything else rests on.
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
omit = ["*/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "../console"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = [
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "ANN201", "ANN001", "ANN002", "ANN003", "D100"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = []

[[tool.mypy.overrides]]
module = ["statsmodels.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Streamlit page modules are scripts, not importable units.
module = ["cartiq_console.*"]
disallow_untyped_decorators = false
